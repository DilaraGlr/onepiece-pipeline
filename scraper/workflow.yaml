main:
  steps:
    - launch_scraper:
        call: http.post
        args:
          url: ${"https://run.googleapis.com/v2/projects/t-lexicon-231513/locations/europe-west1/jobs/onepiece-scraper-job:run"}
          auth:
            type: OAuth2
        result: scraper_response

    - wait_for_scraper:
        steps:
          - check_scraper:
              call: http.get
              args:
                url: ${"https://run.googleapis.com/v2/" + scraper_response.body.name}
                auth:
                  type: OAuth2
              result: scraper_status
          - log_scraper_status:
              call: sys.log
              args:
                data: ${scraper_status.body}
                severity: INFO
          - check_if_done:
              switch:
                - condition: ${default(map.get(scraper_status.body, "done"), false) == true}
                  next: read_scraper_status
              next: sleep_scraper
          - sleep_scraper:
              call: sys.sleep
              args:
                seconds: 30
              next: check_scraper

    - read_scraper_status:
        call: http.get
        args:
          url: https://storage.googleapis.com/storage/v1/b/onepiece-manga-images-tlex/o/_status%2Fscraper-status.json?alt=media
          auth:
            type: OAuth2
        result: scraper_status_file

    - validate_scraper:
        switch:
          - condition: ${scraper_status_file.body.status == "error"}
            raise: '${"Scraper failed: " + default(scraper_status_file.body.error_message, "unknown error")}'
          - condition: ${scraper_status_file.body.status == "success_empty"}
            next: done_empty_pipeline
          - condition: ${scraper_status_file.body.status == "success" and scraper_status_file.body.records_processed > 0}
            next: launch_ocr

    - scraper_invalid_status:
        raise: "Scraper completed with invalid status or 0 records"

    - launch_ocr:
        call: http.post
        args:
          url: ${"https://run.googleapis.com/v2/projects/t-lexicon-231513/locations/europe-west1/jobs/ocr-pipeline-job:run"}
          auth:
            type: OAuth2
        result: ocr_response

    - wait_for_ocr:
        steps:
          - check_ocr:
              call: http.get
              args:
                url: ${"https://run.googleapis.com/v2/" + ocr_response.body.name}
                auth:
                  type: OAuth2
              result: ocr_status
          - check_ocr_done:
              switch:
                - condition: ${default(map.get(ocr_status.body, "done"), false) == true}
                  next: read_ocr_status
              next: sleep_ocr
          - sleep_ocr:
              call: sys.sleep
              args:
                seconds: 30
              next: check_ocr

    - read_ocr_status:
        call: http.get
        args:
          url: https://storage.googleapis.com/storage/v1/b/onepiece-manga-images-tlex/o/_status%2Focr-status.json?alt=media
          auth:
            type: OAuth2
        result: ocr_status_file

    - validate_ocr:
        switch:
          - condition: ${ocr_status_file.body.status == "error"}
            raise: '${"OCR failed: " + default(ocr_status_file.body.error_message, "unknown error")}'
          - condition: ${ocr_status_file.body.status == "success_empty"}
            next: done_empty_pipeline
          - condition: ${ocr_status_file.body.status == "success" and ocr_status_file.body.records_processed > 0}
            next: launch_nlp

    - ocr_invalid_status:
        raise: "OCR completed with invalid status or 0 records"

    - launch_nlp:
        call: http.post
        args:
          url: ${"https://run.googleapis.com/v2/projects/t-lexicon-231513/locations/europe-west1/jobs/nlp-pipeline-job:run"}
          auth:
            type: OAuth2
        result: nlp_response

    - wait_for_nlp:
        steps:
          - check_nlp:
              call: http.get
              args:
                url: ${"https://run.googleapis.com/v2/" + nlp_response.body.name}
                auth:
                  type: OAuth2
              result: nlp_status
          - check_nlp_done:
              switch:
                - condition: ${default(map.get(nlp_status.body, "done"), false) == true}
                  next: read_nlp_status
              next: sleep_nlp
          - sleep_nlp:
              call: sys.sleep
              args:
                seconds: 30
              next: check_nlp

    - read_nlp_status:
        call: http.get
        args:
          url: https://storage.googleapis.com/storage/v1/b/onepiece-manga-images-tlex/o/_status%2Fnlp-status.json?alt=media
          auth:
            type: OAuth2
        result: nlp_status_file

    - validate_nlp:
        switch:
          - condition: ${nlp_status_file.body.status == "error"}
            raise: '${"NLP failed: " + default(nlp_status_file.body.error_message, "unknown error")}'
          - condition: ${nlp_status_file.body.status == "success_empty"}
            next: done_empty_pipeline
          - condition: ${nlp_status_file.body.status == "success" and nlp_status_file.body.records_processed > 0}
            next: done

    - nlp_invalid_status:
        raise: "NLP completed with invalid status or 0 records"

    - done:
        return: "Pipeline One Piece terminé avec succès ! Données traitées à toutes les étapes."

    - done_empty_pipeline:
        return: "Pipeline One Piece terminé : aucune nouvelle donnée à traiter (situation normale)."
